# Gate de qualidade de todo PR e da main. A Vercel faz o build de deploy;
# este workflow garante que nada quebrado chegue lá. Ver docs/DEPLOY.md §3.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# Push na main: um grupo por commit (sem cancelamento) — com vários agentes
# integrando seguido, cancelar fazia o e2e da main nunca terminar.
# Outros eventos (PR/branches): cancela o run anterior da mesma ref.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # versão lida de packageManager
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # lint + typecheck + test + validar:dados
      - run: pnpm check

      - name: build (dados reais, como produção)
        run: pnpm build
        env:
          VERCEL_ENV: production # exclui rascunhos, igual ao deploy de produção

      - name: build (fixtures — garante que o site gera páginas com catálogo preenchido)
        run: pnpm build
        env:
          DADOS_DIR: tests/fixtures/dados

      - name: build (fixtures sem rascunhos — exclusão de rascunho não quebra a geração)
        run: pnpm build
        env:
          DADOS_DIR: tests/fixtures/dados
          INCLUIR_RASCUNHOS: "0"

  # E2E (Playwright + axe, dono: Sonda) contra build de produção com o catálogo
  # fictício — o playwright.config.ts sobe `pnpm build && pnpm start` com
  # DADOS_DIR=tests/fixtures/dados e INCLUIR_RASCUNHOS=0. Projetos: desktop-chromium,
  # mobile-chrome, mobile-safari (WebKit — PWA no iOS) e small.
  e2e:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: versão do Playwright (chave do cache)
        id: pw
        run: echo "versao=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: cache dos navegadores
        id: cache-pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.versao }}-chromium-webkit

      - name: instalar navegadores + dependências do sistema
        if: steps.cache-pw.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium webkit

      # Com cache, os binários já existem; só faltam as libs do sistema (apt).
      - name: instalar só dependências do sistema
        if: steps.cache-pw.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium webkit

      - run: pnpm e2e

      - name: relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
